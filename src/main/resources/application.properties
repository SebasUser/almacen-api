spring.application.name=almacen-api
server.port=${PORT:8080}

# Los valores sensibles NO van aquí: vienen de variables de entorno (nube) o de local.properties (tu PC, no se sube a GitHub)
spring.config.import=optional:classpath:local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# validate: Hibernate solo comprueba que las tablas coincidan, no las modifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000

# Contraseña del administrador inicial (se crea una sola vez, si no hay usuarios)
app.admin.password=${ADMIN_PASSWORD}

# Orígenes permitidos para el frontend (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
